version: 2

models:
  - name: stg_facebook_campaigns
    description: >
      Cleaned Facebook campaign metadata with standardized data types.

    columns:
      - name: campaign_id
        description: "Unique identifier for a Facebook campaign."
        data_tests:
          - not_null
          - unique

      - name: campaign_name
        description: "Name of the Facebook campaign."

      - name: campaign_updated_at
        description: "Timestamp when the campaign record was last updated."
