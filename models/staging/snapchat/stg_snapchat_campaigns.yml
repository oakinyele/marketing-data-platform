version: 2

models:
  - name: stg_snapchat_campaigns
    description: >
      Cleaned Snapchat campaign metadata with standardized identifiers.

    columns:
      - name: campaign_id
        description: "Unique identifier for a Snapchat campaign."
        data_tests:
          - not_null
          - unique

      - name: account_id
        description: "Identifier of the account associated with the campaign."
        data_tests:
          - not_null

      - name: campaign_name
        description: "Name of the Snapchat campaign."
        data_tests:
          - not_null
